version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - rm -f .env.production
        - touch .env.production
        - env | grep -e '^MONGODB_URI=' >> .env.production || true
        - env | grep -e '^MONGODB_DB=' >> .env.production || true
        - env | grep -e '^JWT_SECRET=' >> .env.production || true
        - env | grep -e '^NEXTAUTH_SECRET=' >> .env.production || true
        - env | grep -e '^NEXTAUTH_URL=' >> .env.production || true
        - env | grep -e '^S3_REGION=' >> .env.production || true
        - env | grep -e '^S3_BUCKET=' >> .env.production || true
        - env | grep -e '^NEXT_PUBLIC_' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
